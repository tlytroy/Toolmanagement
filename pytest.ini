[pytest]
# Only collect our own tests. Without this, bare `pytest` also descends into
# reference/oss/tracefinity/backend/tests/ (46 vendored upstream tests that
# need that project's own dependencies/fixtures), producing 42 collection
# errors and interrupting the whole run. Project tests live in one place.
testpaths = python_backend/tests

# Keep output readable; the xfail for the known +3.4mm segmenter bias is strict
# on purpose (see docs/PROJECT_STATUS.md §4.2), so leave xfail strictness to
# the test itself rather than a global override.
xfail_strict = false
